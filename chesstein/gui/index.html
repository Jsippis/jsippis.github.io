<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chesstein</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sq-light: #e8dcc8;
    --sq-dark: #8b6f52;
    --sq-highlight: #f6f669cc;
    --sq-selected: #20a8d855;
    --sq-lastmove: #cdd16e88;
    --sq-legal: #20202055;
    --bg: #1a1612;
    --panel: #221e1a;
    --border: #3a3228;
    --text: #e8dcc8;
    --muted: #8a7a6a;
    --accent: #c9a227;
    --ws-ok: #4caf73;
    --ws-err: #e05a4e;
    --ws-off: #8a7a6a;
    --strip-h: 34px;
    --cap-row-h: 16px;
    --board-top: calc(var(--cap-row-h) + var(--strip-h));
    --app-content-h: calc(100dvh - 74px);
    --sq: var(--auto-sq, clamp(42px, min(calc((100dvh - 220px) / 8), calc((100vw - 360px) / 8)), 96px));
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    height: 100dvh;
    min-height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(10px, 1.8vh, 18px) clamp(10px, 1.8vw, 18px);
    gap: 0;
  }

  body.review-active {
    --sq: var(--auto-sq, clamp(38px, min(calc((100dvh - 232px) / 8), calc((100vw - 700px) / 8)), 78px));
  }

  header {
    width: min(100%, 1420px);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: clamp(8px, 1.4vh, 14px);
    flex: 0 0 auto;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .header-right {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    min-width: 0;
  }


  .game-strip {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    max-width: min(760px, 54vw);
  }
  .game-strip .disconnect-banner,
  .game-strip .draw-offer-panel,
  .game-strip .game-over-panel {
    margin: 0;
    padding: 6px 8px;
    border-radius: 999px;
    font-size: 11px;
    line-height: 1.15;
    white-space: nowrap;
  }
  .game-strip .disconnect-banner { display: none; }
  .game-strip .disconnect-banner.show { display: block; }
  .game-strip .game-actions,
  .game-strip .mini-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 0;
  }
  .game-strip .game-actions button,
  .game-strip .mini-actions button {
    flex: none;
    padding: 5px 10px;
    border-radius: 999px;
    font-size: 10px;
    line-height: 1;
  }
  .game-strip .game-over-panel strong,
  .game-strip .draw-offer-panel strong {
    margin-right: 8px;
    color: var(--text);
  }
  .game-strip .muted { display: inline; margin: 0 8px 0 0; font-size: 10px; color: var(--muted); }

  .tiny-action {
    flex: none;
    padding: 5px 9px;
    border-radius: 999px;
    font-size: 10px;
    line-height: 1;
    color: var(--muted);
  }
  .tiny-action:hover { color: var(--accent); }

  .home-link {
    color: var(--muted);
    text-decoration: none;
    font-size: 12px;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 10px;
    transition: all 0.15s ease;
  }

  .home-link:hover {
    color: var(--text);
    border-color: var(--accent);
    background: rgba(201, 162, 39, 0.08);
  }

  .session-badge {
    color: var(--accent);
    border: 1px solid rgba(201, 162, 39, 0.35);
    border-radius: 999px;
    padding: 5px 9px;
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background: rgba(201, 162, 39, 0.08);
  }

  .logo {
    white-space: nowrap;
    font-family: 'Fraunces', serif;
    font-size: 28px;
    font-weight: 300;
    letter-spacing: -0.5px;
    color: var(--text);
  }

  .logo span { color: var(--accent); }

  #ws-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  #ws-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--ws-off);
    transition: background 0.3s;
  }
  #ws-dot.ok { background: var(--ws-ok); box-shadow: 0 0 6px var(--ws-ok); }
  #ws-dot.err { background: var(--ws-err); }

  .main {
    display: grid;
    grid-template-columns: max-content minmax(260px, 320px);
    gap: clamp(12px, 1.6vw, 22px);
    align-items: flex-start;
    justify-content: center;
    width: fit-content;
    max-width: 100%;
    flex: 1 1 auto;
    min-height: 0;
    max-height: var(--app-content-h);
  }

  body.review-active .main {
    grid-template-columns: max-content minmax(430px, 760px);
    width: min(100%, 1460px);
    justify-content: center;
  }

  .board-wrap {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0;
    flex-shrink: 0;
    position: relative;
    margin-left: 20px;
    padding-right: 28px;
  }


  .player-strip {
    width: calc(var(--sq) * 8 + 4px);
    height: var(--strip-h);
    min-height: var(--strip-h);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border: 1px solid var(--border);
    background: rgba(34, 30, 26, 0.92);
    color: var(--text);
    padding: 7px 10px;
    font-size: 12px;
  }
  .capture-row {
    width: calc(var(--sq) * 8 + 4px);
    height: var(--cap-row-h);
    min-height: var(--cap-row-h);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1px;
    padding: 0 4px;
    overflow: hidden;
  }
  .capture-row:empty::after {
    content: '';
    display: block;
    height: 1px;
  }

  .player-strip.top { border-radius: 7px 7px 0 0; border-bottom: 0; }
  .player-strip.bottom { border-radius: 0 0 7px 7px; border-top: 0; }
  .player-main { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .player-dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--muted); flex: 0 0 auto; }
  .player-dot.white { background: #f0e8d8; border-color: #f0e8d8; }
  .player-dot.black { background: #2a2420; border-color: var(--muted); }
  .player-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .player-tag { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; }
  .player-clock {
    font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Consolas, monospace;
    font-weight: 800;
    font-size: 18px;
    min-width: 72px;
    text-align: right;
    color: var(--text);
  }
  .player-clock.running { color: var(--accent); }
  .player-clock.low { color: var(--danger); }
  .player-strip.disconnected { border-color: rgba(224, 90, 78, 0.65); color: #f0aaa3; background: rgba(224, 90, 78, 0.10); }
  .player-strip.disconnected .player-tag { color: #f0aaa3; }

  .board-row {
    display: flex;
    align-items: center;
  }

  .rank-label {
    width: 22px;
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    flex-shrink: 0;
  }

  .file-labels {
    display: flex;
    margin-left: 0;
    margin-top: 4px;
  }

  .file-label {
    width: var(--sq);
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
  }

  #board {
    display: grid;
    grid-template-columns: repeat(8, var(--sq));
    grid-template-rows: repeat(8, var(--sq));
    border: 2px solid var(--border);
    cursor: default;
  }

  .sq {
    width: var(--sq);
    height: var(--sq);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: pointer;
    user-select: none;
    transition: filter 0.1s;
  }

  .sq.light { background: var(--sq-light); }
  .sq.dark  { background: var(--sq-dark); }
  .sq.selected { background: var(--sq-selected) !important; }
  .sq.lastmove { background: var(--sq-lastmove) !important; }
  .sq.legal-target::after {
    content: '';
    position: absolute;
    width: 30%;
    height: 30%;
    border-radius: 50%;
    background: var(--sq-legal);
    pointer-events: none;
  }
  .sq.legal-capture::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 5px solid var(--sq-legal);
    pointer-events: none;
  }
  .sq.ai-hint {
    box-shadow: inset 0 0 0 4px var(--accent);
  }

  .piece {
    width: 88%;
    height: 88%;
    pointer-events: none;
    transition: opacity 0.1s;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5));
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .piece-img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    pointer-events: none;
    user-select: none;
  }

  .panel {
    display: grid;
    grid-template-columns: 1fr;
    gap: clamp(8px, 1vh, 10px);
    min-width: 0;
    max-height: var(--app-content-h);
    overflow-y: auto;
    padding-right: 2px;
    align-content: start;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  body.review-active .panel {
    grid-template-columns: 1fr;
    gap: clamp(10px, 1.2vh, 14px);
    max-height: var(--app-content-h);
  }

  .move-card, .review-card { grid-column: 1 / -1; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: clamp(10px, 1.1vw, 14px);
  }

  .card-title {
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  #turn-indicator {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
  }

  .turn-dot {
    width: 14px; height: 14px;
    border-radius: 50%;
    border: 2px solid var(--muted);
    flex-shrink: 0;
  }
  .turn-dot.white { background: #f0e8d8; border-color: #f0e8d8; }
  .turn-dot.black { background: #2a2420; border-color: var(--muted); }

  #status-text {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.6;
    min-height: 40px;
  }

  #status-text.alert { color: var(--accent); }

  .move-history {
    max-height: clamp(120px, 28dvh, 300px);
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .move-pair {
    display: grid;
    grid-template-columns: 28px 1fr 1fr;
    gap: 4px;
    font-size: 12px;
    padding: 3px 0;
    border-bottom: 1px solid var(--border);
  }

  .move-num { color: var(--muted); }
  .move-san {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 5px;
    min-width: 0;
    padding: 1px 4px;
    border-radius: 3px;
    cursor: pointer;
  }
  .move-san:hover { background: var(--border); }
  .move-san.current { color: var(--accent); }
  .move-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .move-label {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    padding: 1px 4px;
    border-radius: 999px;
    border: 1px solid rgba(232, 220, 200, 0.12);
    background: rgba(232, 220, 200, 0.06);
    color: var(--muted);
    font-size: 8px;
    line-height: 1.25;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .move-label.best, .review-classification.best { color: #f6d86f; border-color: rgba(246, 216, 111, 0.45); background: rgba(246, 216, 111, 0.12); }
  .move-label.excellent, .review-classification.excellent { color: #8fd694; border-color: rgba(143, 214, 148, 0.38); background: rgba(143, 214, 148, 0.11); }
  .move-label.good, .review-classification.good { color: #a7c8f2; border-color: rgba(167, 200, 242, 0.35); background: rgba(167, 200, 242, 0.10); }
  .move-label.inaccuracy, .review-classification.inaccuracy { color: #e6c36a; border-color: rgba(230, 195, 106, 0.42); background: rgba(230, 195, 106, 0.11); }
  .move-label.mistake, .review-classification.mistake { color: #ee9b61; border-color: rgba(238, 155, 97, 0.45); background: rgba(238, 155, 97, 0.12); }
  .move-label.blunder, .review-classification.blunder { color: #f08379; border-color: rgba(240, 131, 121, 0.48); background: rgba(240, 131, 121, 0.13); }

  .captures {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
    min-height: 28px;
    align-items: center;
  }

  .captured-piece {
    width: 17px;
    height: 17px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.45));
  }

  .controls {
    display: flex;
    gap: 8px;
  }

  button {
    flex: 1;
    padding: 8px 0;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }

  button:hover { border-color: var(--accent); color: var(--accent); }
  button:active { background: var(--border); }

  #connect-btn {
    background: var(--accent);
    border-color: var(--accent);
    color: #1a1612;
    font-weight: 500;
    flex: none;
    padding: 8px 16px;
  }
  #connect-btn:hover { background: #d4a830; border-color: #d4a830; color: #1a1612; }

  #ws-url {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 8px 10px;
    width: 100%;
  }
  #ws-url:focus { outline: 1px solid var(--accent); border-color: var(--accent); }

  .conn-row { display: flex; gap: 8px; }

  .online-meta {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    font-size: 11px;
  }
  .online-meta div {
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px;
    color: var(--muted);
  }
  .online-meta strong {
    display: block;
    color: var(--text);
    font-size: 12px;
    margin-top: 2px;
  }
  .opponent-line.disconnected { color: #f0aaa3 !important; }
  .opponent-line.disconnected strong { color: #f0aaa3 !important; }
  .disconnect-banner {
    display: none;
    margin-top: 10px;
    border: 1px solid rgba(224, 90, 78, 0.55);
    background: rgba(224, 90, 78, 0.10);
    color: #f0aaa3;
    border-radius: 6px;
    padding: 10px;
    font-size: 12px;
    line-height: 1.45;
  }
  .disconnect-banner.show { display: block; }
  .game-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .game-actions button.danger { border-color: rgba(224, 90, 78, 0.6); color: #f0aaa3; }
  .game-actions button.danger:hover { border-color: var(--ws-err); color: var(--ws-err); }
  .draw-offer-panel, .game-over-panel {
    margin-top: 10px;
    border: 1px solid rgba(201, 162, 39, 0.28);
    background: rgba(201, 162, 39, 0.08);
    border-radius: 6px;
    padding: 10px;
    font-size: 12px;
    color: var(--text);
  }
  .draw-offer-panel .muted, .game-over-panel .muted {
    color: var(--muted);
    font-size: 11px;
    margin-top: 3px;
  }
  .mini-actions { display: flex; gap: 8px; margin-top: 10px; }
  .mini-actions button { flex: 1; }


  .review-card {
    border-color: rgba(201, 162, 39, 0.35);
    background: rgba(201, 162, 39, 0.06);
  }
  .review-card .review-title-line {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: baseline;
    margin-bottom: 10px;
    font-size: 12px;
  }
  .review-card .review-title-line strong { color: var(--text); }
  .review-card .review-title-line span { color: var(--muted); font-size: 11px; }
  .review-controls {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    margin-top: 10px;
  }
  .review-controls button { padding: 7px 0; }
  .review-progress {
    margin-top: 8px;
    color: var(--muted);
    font-size: 11px;
    min-height: 16px;
  }
  .review-graph-wrap {
    display: none;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .review-graph-title {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: baseline;
    color: var(--muted);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 7px;
  }
  .review-graph-title strong {
    color: var(--text);
    text-transform: none;
    letter-spacing: 0;
  }
  .review-graph {
    width: 100%;
    height: 58px;
    display: block;
    overflow: visible;
  }
  .review-graph-baseline { stroke: rgba(232, 220, 200, 0.22); stroke-width: 1; }
  .review-graph-line { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .review-graph-current { fill: var(--text); stroke: var(--accent); stroke-width: 1.5; }
  .review-arrows {
    position: absolute;
    left: 2px;
    top: calc(var(--board-top) + 2px);
    width: calc(var(--sq) * 8);
    height: calc(var(--sq) * 8);
    pointer-events: none;
    z-index: 6;
    overflow: visible;
  }
  .review-arrow-line {
    fill: none;
    stroke-width: 6;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0.86;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.55));
  }
  .review-arrow-line.best { stroke: var(--accent); }
  .review-engine {
    margin-top: 12px;
    border: 1px solid rgba(201, 162, 39, 0.22);
    border-radius: 6px;
    padding: 10px;
    background: rgba(0, 0, 0, 0.10);
    font-size: 11px;
    line-height: 1.45;
  }
  .review-engine-row {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: baseline;
  }
  .review-engine-row span { color: var(--muted); }
  .review-engine-row strong { color: var(--text); text-align: right; }
  .review-score {
    margin-top: 8px;
    font-size: 21px;
    font-family: 'Fraunces', serif;
    color: var(--accent);
    letter-spacing: -0.02em;
  }
  .review-classification {
    display: inline-flex;
    align-items: center;
    width: fit-content;
    margin: 0 0 8px;
    padding: 4px 8px;
    border-radius: 999px;
    border: 1px solid rgba(232, 220, 200, 0.12);
    background: rgba(232, 220, 200, 0.06);
    color: var(--muted);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .review-engine-line {
    margin-top: 6px;
    color: var(--muted);
    word-break: break-word;
  }
  .review-engine-actions {
    display: flex;
    gap: 6px;
    margin-top: 10px;
  }
  .review-engine-actions button { padding: 7px 0; }
  .review-eval-bar {
    position: absolute;
    left: calc(var(--sq) * 8 + 14px);
    top: var(--board-top);
    width: 18px;
    height: calc(var(--sq) * 8 + 4px);
    border: 1px solid var(--border);
    border-radius: 999px;
    overflow: visible;
    background: #181310;
    box-shadow: 0 2px 8px rgba(0,0,0,0.35);
    z-index: 4;
  }
  .review-eval-white {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 50%;
    background: #e8dcc8;
    transition: height 0.25s ease;
    border-radius: 0 0 999px 999px;
  }
  .review-eval-label {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    color: var(--accent);
    font-size: 10px;
    font-weight: 800;
    line-height: 1;
    padding: 3px 5px;
    border-radius: 999px;
    background: rgba(24, 19, 16, 0.82);
